{% load static %}

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" />

<nav class="navbar navbar-header navbar-header-transparent navbar-expand-lg border-bottom bg-primary">
  <div class="container-fluid">
    <ul class="navbar-nav topbar-nav ms-md-auto align-items-center">

      <!-- SEARCH ICON (mobile) -->
      <li class="nav-item topbar-icon dropdown d-flex d-lg-none">
        <a class="nav-link dropdown-toggle text-white fs-4" data-bs-toggle="dropdown" href="#" role="button">
          <i class="fas fa-search"></i>
        </a>
        <ul class="dropdown-menu dropdown-search animated fadeIn">
          <form class="navbar-left navbar-form nav-search">
            <div class="input-group">
              <input type="text" placeholder="Search ..." class="form-control">
            </div>
          </form>
        </ul>
      </li>

      <!-- MESSAGES -->
      <li class="nav-item topbar-icon dropdown">
        <a class="nav-link dropdown-toggle text-white fs-4" href="#" id="messageDropdown" role="button" data-bs-toggle="dropdown">
          <i class="fas fa-envelope"></i>
        </a>
        <ul class="dropdown-menu messages-notif-box animated fadeIn" aria-labelledby="messageDropdown">
          <li>
            <div class="dropdown-title d-flex justify-content-between align-items-center">
              Messages
              <a href="#" class="small">Mark all as read</a>
            </div>
          </li>
          <li class="notif-center">

            <a href="#" class="d-flex align-items-center px-2 py-1">
              <div class="notif-icon notif-primary text-white fs-3 me-2"><i class="fas fa-user-circle"></i></div>
              <div class="notif-content">
                <span class="subject fw-bold">Jimmy Denis</span>
                <span class="block d-block">How are you?</span>
                <span class="time text-muted small">5 minutes ago</span>
              </div>
            </a>

            <a href="#" class="d-flex align-items-center px-2 py-1">
              <div class="notif-icon notif-primary text-white fs-3 me-2"><i class="fas fa-user-circle"></i></div>
              <div class="notif-content">
                <span class="subject fw-bold">Chad</span>
                <span class="block d-block">Ok, Thanks!</span>
                <span class="time text-muted small">12 minutes ago</span>
              </div>
            </a>

          </li>
          <li>
            <a class="see-all d-flex justify-content-between align-items-center px-2 py-1" href="javascript:void(0);">
              See all messages <i class="fas fa-angle-right"></i>
            </a>
          </li>
        </ul>
      </li>

      <!-- NOTIFICATIONS -->
      <li class="nav-item topbar-icon dropdown position-relative">
        <a class="nav-link dropdown-toggle text-white fs-4 position-relative" href="#" id="notifDropdown" data-bs-toggle="dropdown">
          <i class="fas fa-bell"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            4
          </span>
        </a>
        <ul class="dropdown-menu notif-box animated fadeIn" aria-labelledby="notifDropdown">
          <li><div class="dropdown-title">You have 4 new notifications</div></li>
        </ul>
      </li>

      <!-- QUICK ACTIONS -->
      <li class="nav-item topbar-icon dropdown">
        <a class="nav-link text-white fs-4" data-bs-toggle="dropdown" href="#">
          <i class="fas fa-layer-group"></i>
        </a>
      </li>

      <!-- USER MENU -->
      <li class="nav-item topbar-user dropdown">
        <a class="dropdown-toggle profile-pic text-white fs-5" data-bs-toggle="dropdown" href="#">
          {% if user.is_authenticated %}
          <span class="op-7">Hello,</span> <span class="fw-bold">{{ user.username }}</span>
          {% else %}
          <span class="op-7">Hi, Guest</span>
          {% endif %}
        </a>
      </li>

    </ul>
  </div>
</nav>
