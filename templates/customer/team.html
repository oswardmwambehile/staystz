{% load static %}

<!-- Google Font -->


<section class="bg-white pt-24 pb-16">

    <div class="grid md:grid-cols-2 gap-10 items-center">

      <!-- LEFT CONTENT -->
      <div>
        <h3 class="text-xl md:text-2xl font-semibold mb-8">

        </p>

      <!-- RIGHT IMAGE -->
      <div class="w-full">
        <img
          src="{% static 'customer/img/a1.jpg' %}"
          class="w-full h-[300px] md:h-[400px] object-cover rounded-xl shadow-lg"

    </div>
