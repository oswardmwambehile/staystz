{% load static %}

<form method="GET" action="">
  <div class="bg-[#1591bc] mb-12">
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">

      <!-- Center Wrapper -->
      <div class="flex justify-center">
        <div class="w-full lg:w-3/4 grid grid-cols-1 md:grid-cols-3 gap-4">

          <!-- Keyword Search -->
          <div>
            <input type="text"
                   name="keyword"
                   value="{{ request.GET.keyword }}"
                   placeholder="Search Keyword"
                   class="w-full py-3 px-4 rounded-[10px] text-center shadow-md focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50">
          </div>

          <!-- Region Select -->
          <div>
            <select name="region"
                    class="w-full py-3 px-4 rounded-[10px] text-center shadow-md bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50">
              <option value="">Select Region</option>
              {% for reg in tanzania_regions %}
                <option value="{{ reg }}"
                  {% if request.GET.region == reg %}selected{% endif %}>
                  {{ reg }}
                </option>
              {% endfor %}
            </select>
          </div>

          <!-- Search Button -->
          <div>
            <button type="submit"
                    class="w-full py-3 rounded-[10px] bg-white text-black font-semibold hover:bg-white transition">
              Search
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</form>
